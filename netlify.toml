# RETIRADO (2026-11-04): el frontend vive en Cloudflare Workers Static Assets
# (frontend/wrangler.jsonc). Netlify ya no construye: el comando "ignore" sale con 0,
# lo que cancela cada build sin consumir minutos. El último deploy sigue en línea
# para enlaces antiguos hasta que se apague el sitio (ver docs/MIGRACION_CLOUDFLARE.md).
[build]
  ignore = "exit 0"
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_PUBLIC_DEMO = "false"
  VITE_API_URL = "https://catalogo-lite-api.catalogo-lite-worker.workers.dev"

[[redirects]]
  from = "/api/assets/*"
  to = "https://catalogo-lite-api.catalogo-lite-worker.workers.dev/api/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
