[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  VITE_PUBLIC_DEMO = "false"
  VITE_API_URL = "https://catalogo-lite-api.catalogo-lite-worker.workers.dev"

[[redirects]]
  from = "/api/assets/*"
  to = "https://catalogo-lite-api.catalogo-lite-worker.workers.dev/api/assets/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
