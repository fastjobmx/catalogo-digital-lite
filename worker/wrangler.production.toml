name = "catalogo-lite-api"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Purge expired Telegram product drafts and recover R2 objects left by partial publishes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
STORE_NAME = "SneakerHub Premium"
STORE_CURRENCY = "COP"
STORE_COUNTRY = "CO"
# Frontend en Cloudflare Workers Static Assets. Netlify queda solo durante la transición
# (enlaces ya entregados); retirarlo de esta lista cuando se apague el sitio.
ALLOWED_ORIGIN = "https://app.tiendiaexpres.com,https://catalogo-digital-ia.catalogo-lite-worker.workers.dev,https://catalogo-digital-ia.netlify.app"
COMMERCE_ENABLED = "true"
# Plataforma 3.0: base pública para enlaces de tiendas (/t/<dirección>) y activaciones.
PUBLIC_STORE_BASE_URL = "https://app.tiendiaexpres.com"
# Estudio IA: modelo que devuelve imágenes y su precio de salida (US$60 por millón de tokens de imagen)
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
GEMINI_IMAGE_PRICE_OUTPUT_MICROS_PER_MTOK = "60000000"
# Secretos adicionales (wrangler secret put): MASTER_BOT_TOKEN, MASTER_WEBHOOK_SECRET,
# MASTER_ADMIN_TELEGRAM_IDS. Opcional: TELEGRAM_BOT_USERNAME, PLATFORM_AI_MONTHLY_CAP_MICROS.

[[d1_databases]]
binding = "DB"
database_name = "catalogo-lite-production-db"
database_id = "10b10054-9e28-4346-8b2b-a19323ed27f3"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "catalogo-lite-production-assets"
