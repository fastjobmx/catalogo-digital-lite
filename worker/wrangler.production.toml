name = "catalogo-lite-api"
main = "src/index.ts"
compatibility_date = "2024-12-05"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# Purge expired Telegram product drafts and recover R2 objects left by partial publishes.
[triggers]
crons = ["*/15 * * * *"]

[vars]
ENVIRONMENT = "production"
STORE_NAME = "SneakerHub Premium"
STORE_CURRENCY = "COP"
STORE_COUNTRY = "CO"
# Frontend en Cloudflare Workers Static Assets. Netlify queda solo durante la transición
# (enlaces ya entregados); retirarlo de esta lista cuando se apague el sitio.
ALLOWED_ORIGIN = "https://app.tiendiaexpres.com,https://catalogo-digital-ia.catalogo-lite-worker.workers.dev,https://catalogo-digital-ia.netlify.app"
COMMERCE_ENABLED = "true"
# Cuota de mensajes con IA por plan: solo observa (así corre producción desde 56b1450b, donde se pasó con
# --var). Queda escrita aquí para que ninguna publicación la devuelva al valor por defecto sin querer.
AI_MESSAGE_QUOTA_MODE = "shadow"
# Control de gasto IA (src/ai/spendGuard.ts): 'shadow' reserva, concilia y alerta sin bloquear. Pasar a 'enforce'
# SOLO con la aprobación del propietario y los límites aprobados cargados (docs/BLINDAJE_ECONOMICO_IA.md).
AI_SPEND_GUARD_MODE = "shadow"
# IA por plan (consultas, créditos y API propia): AI_FX_COP_PER_USD convierte el presupuesto interno de cada plan.
# La API propia necesita el SECRETO AI_KEYS_MASTER_KEY (32 bytes en base64, `wrangler secret put`); sin él la sección
# «Mi API» queda deshabilitada. Nunca escribirlo aquí.
AI_FX_COP_PER_USD = "4000"
# Plataforma 3.0: base pública para enlaces de tiendas (/t/<dirección>) y activaciones.
PUBLIC_STORE_BASE_URL = "https://app.tiendiaexpres.com"
# Correo transaccional (Resend). La clave va como secreto RESEND_API_KEY, nunca aquí.
# Dominio tiendiaexpres.com verificado en Resend (DKIM resend._domainkey, MX/SPF en send.).
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "TiendIA Exprés <notificaciones@tiendiaexpres.com>"
# soporte@ reenvía al buzón real mediante Cloudflare Email Routing.
EMAIL_REPLY_TO = "soporte@tiendiaexpres.com"
# Respuestas de los correos comerciales (prueba por vencer o finalizada, contratación y plan activado).
# ventas@ reenvía al buzón real mediante Cloudflare Email Routing (comprobar la recepción antes de publicar).
EMAIL_REPLY_TO_SALES = "ventas@tiendiaexpres.com"
# Envío ÚNICO de verificación a cuentas activadas sin confirmar (cron; no reenvía a quien ya lo recibió).
# Activa en producción desde bcad5c18 (2026-11-16); escrita aquí para que una publicación no la apague sin querer.
EMAIL_VERIFICATION_BACKFILL = "true"
# Únicas direcciones (además del superadmin) que pueden recibir correos de prueba.
EMAIL_TEST_RECIPIENTS = "explorandocdsm@gmail.com"
# Estudio IA: modelo que devuelve imágenes y su precio de salida (US$60 por millón de tokens de imagen)
GEMINI_IMAGE_MODEL = "gemini-3.1-flash-image"
GEMINI_IMAGE_PRICE_OUTPUT_MICROS_PER_MTOK = "60000000"
# Asistente administrativo por WhatsApp.
# - API oficial de Meta: APAGADA (WHATSAPP_ADMIN_BOT_ENABLED).
# - WAHA (vía no oficial) ENCENDIDO desde 2026-11-17 por decisión del propietario: corre en el PC de la oficina
#   (carpeta waha-tiendia, botones «Encender/Apagar WhatsApp») y entra por el túnel fijo waha.tiendiaexpres.com.
#   Si el PC está apagado, el bot no responde; Telegram y el panel siguen igual. Apagado inmediato: WAHA_ENABLED = "false".
#   Secretos (wrangler secret put): WAHA_API_KEY, WAHA_GATEWAY_TOKEN, WAHA_WEBHOOK_HMAC_KEY.
# - Tiendas habilitadas: "*" = todas (decisión del propietario, 2026-11-17). Para limitar, poner ids separados por coma.
WHATSAPP_ADMIN_BOT_ENABLED = "false"
WHATSAPP_PILOT_STORE_IDS = "*"
WAHA_ENABLED = "true"
WAHA_SESSION = "tiendia"
# Número del bot que ven los comercios para escribirle (público, no es un secreto).
WAHA_DISPLAY_NUMBER = "573018589121"
WAHA_API_URL = "https://waha.tiendiaexpres.com"
WAHA_PHOTO_BATCH_ENABLED = "true"
WAHA_PHOTO_QUIET_SECONDS = "20"
WAHA_PHOTO_BATCH_MAX = "100"
# Secretos adicionales (wrangler secret put): MASTER_BOT_TOKEN, MASTER_WEBHOOK_SECRET,
# MASTER_ADMIN_TELEGRAM_IDS. Opcional: TELEGRAM_BOT_USERNAME, PLATFORM_AI_MONTHLY_CAP_MICROS.

[[d1_databases]]
binding = "DB"
database_name = "catalogo-lite-production-db"
database_id = "10b10054-9e28-4346-8b2b-a19323ed27f3"
migrations_dir = "../database/migrations"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "catalogo-lite-production-assets"

# Cola de trabajos del asistente por WhatsApp (lotes de fotos de WAHA).
[[queues.producers]]
binding = "WHATSAPP_JOBS"
queue = "tiendia-whatsapp-jobs"

[[queues.consumers]]
queue = "tiendia-whatsapp-jobs"
max_batch_size = 5
max_batch_timeout = 1
max_retries = 3
